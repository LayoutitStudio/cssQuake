        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

        display: none;
        content: none;

      .quake-loading-mark > * {
        position: relative;
        z-index: 1;
      }

      .quake-loading-readout {
        position: absolute;
        top: 64px;
        left: 12px;
        right: 12px;

        flex-direction: column;
        align-items: flex-start;

        gap: 8px;
      }

      #quake-loading-status {
        display: flex;

        align-items: flex-start;
        justify-content: flex-start;
        width: min(720px, calc(100vw - 24px));
        color: #e8d8ad;
        font: 400 14px/1.2 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0;
        text-shadow: 2px 2px 0 #000000;
      }

      #quake-loading-status::before {
        display: none;
        content: none;
      }

      #quake-loading-status .quake-bitmap-text {
        --quake-bitmap-glyph-size: 16px;
        --quake-bitmap-sheet-size: 256px;
        --quake-bitmap-space-size: 16px;
        justify-content: flex-start;
        gap: 0 var(--quake-bitmap-space-size);
      }

      .quake-loading-console-line {
        display: block;
        min-height: 16px;
        margin: 0 0 2px;
        overflow-wrap: anywhere;
      }

      .quake-bitmap-source {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .quake-bitmap-host {
        font-size: 0;
        line-height: 0;
      }

      .quake-bitmap-text {
        --quake-bitmap-glyph-size: 16px;
        --quake-bitmap-sheet-size: 256px;
        --quake-bitmap-space-size: 11px;
        display: flex;
        flex-wrap: wrap;
        gap: 5px var(--quake-bitmap-space-size);
        max-width: 100%;
        image-rendering: pixelated;
        pointer-events: none;
        vertical-align: top;
      }

      .quake-bitmap-text--title {
        --quake-bitmap-glyph-size: 40px;
        --quake-bitmap-sheet-size: 640px;
        --quake-bitmap-space-size: 28px;
      }

      .quake-bitmap-word {
        display: inline-flex;
        flex: 0 0 auto;
        height: var(--quake-bitmap-glyph-size);
      }

      .quake-bitmap-glyph {
        display: block;
        flex: 0 0 auto;
        width: var(--quake-bitmap-glyph-size);
        height: var(--quake-bitmap-glyph-size);
        background-image: url("/q/conchars.png");
        background-size: var(--quake-bitmap-sheet-size) var(--quake-bitmap-sheet-size);
        image-rendering: pixelated;
      }

      .quake-bitmap-col-1 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -1); }
      .quake-bitmap-col-4 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -4); }
      .quake-bitmap-col-7 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -7); }
      .quake-bitmap-col-9 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -9); }
      .quake-bitmap-col-12 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -12); }
      .quake-bitmap-col-14 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -14); }
      .quake-bitmap-col-15 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -15); }
      .quake-bitmap-row-12 { background-position-y: calc(var(--quake-bitmap-glyph-size) * -12); }
      .quake-bitmap-row-14 { background-position-y: calc(var(--quake-bitmap-glyph-size) * -14); }

      #quake-loading-progress {
        --quake-loading-progress: 0;
        display: none;
        position: relative;
        width: min(250px, 72vw);
        height: 14px;
        padding: 2px;
        overflow: hidden;
        border: 2px solid #523821;
        background: #120b07;
        box-shadow:
          4px 4px 0 #000000,
          0 2px 0 #000000,
          inset 0 1px 0 rgba(240, 173, 92, 0.25),
          inset 0 -1px 0 rgba(0, 0, 0, 0.75);
      }

      #quake-loading-progress-fill {
        display: block;
        width: 100%;
        height: 100%;
        transform: scaleX(var(--quake-loading-progress));
        transform-origin: left center;
        background: #7f4a2f;
        image-rendering: pixelated;
        transition: transform 120ms steps(8, end);
      }

      #quake-loading-progress.quake-loading-progress-indeterminate #quake-loading-progress-fill {
        width: 36%;
        transform: translateX(-100%);
        animation: quake-loading-progress-indeterminate 900ms steps(12, end) infinite;
      }

      @keyframes quake-loading-progress-indeterminate {
        to {
          transform: translateX(280%);
        }
      }

      #quake-loading-overlay.quake-loading-console-persisted {
        z-index: 2;
        pointer-events: none;
        cursor: default;
      }

      @media (any-pointer: coarse), (max-width: 960px) and (orientation: landscape) {
        #quake-loading-overlay.quake-loading-console-persisted .quake-loading-readout {
          display: none;

      #quake-main-menu {
        position: absolute;

        display: grid;

        pointer-events: none;

      #quake-main-menu-art {
        --quake-main-menu-px: calc(100cqw / 320);

        --quake-main-menu-cursor-gap: 0.625cqw;

        --quake-menu-offset-y: 13.5%;
        position: relative;
        display: grid;
        justify-items: center;
        align-items: start;
        width: min(860px, calc(100vw - 64px), calc(150dvh - 52px));
        aspect-ratio: 320 / 200;
        image-rendering: pixelated;
        transform: translateY(var(--quake-menu-offset-y));
        container-type: inline-size;

      @media (max-width: 680px) {

      }

      .quake-main-menu-item {
        position: relative;

        align-items: flex-start;

        min-height: var(--quake-main-menu-row-height);
        opacity: 1;
        cursor: default;

      body.quake-main-menu-pending #quake-main-menu-list > .quake-main-menu-item {

      }

      #quake-main-menu-list > .quake-main-menu-item-disabled {

        opacity: 0.46;

        pointer-events: auto;
      }

      .quake-main-menu-item[data-quake-main-menu-action="level-select"] {
        display: none;
      }

      .quake-main-menu-label {
        display: block;
        width: calc(var(--quake-main-menu-label-width) * var(--quake-main-menu-px));
        height: calc(var(--quake-main-menu-label-height) * var(--quake-main-menu-px));
        image-rendering: pixelated;
        overflow: visible;
        pointer-events: none;
        transform: translateY(calc(var(--quake-main-menu-label-offset-y, 0) * var(--quake-main-menu-px)));
      }

      .quake-main-menu-note {
        position: absolute;
        top: 50%;
        left: calc(100% + 1.25cqw);
        display: none;
        width: calc(31 * var(--quake-main-menu-px));

        pointer-events: none;
      }

      .quake-main-menu-note .quake-bitmap-text {
        --quake-bitmap-glyph-size: calc(5 * var(--quake-main-menu-px));
        --quake-bitmap-sheet-size: calc(80 * var(--quake-main-menu-px));
        --quake-bitmap-space-size: calc(1 * var(--quake-main-menu-px));
        align-content: center;
        gap: calc(1 * var(--quake-main-menu-px)) var(--quake-bitmap-space-size);
      }

      #quake-main-menu-list > .quake-main-menu-item-disabled[data-quake-main-menu-action="multiplayer"] .quake-main-menu-note-coming-soon:not([hidden]) {
        display: block;

      body.quake-main-menu-pending #quake-main-menu-list .quake-main-menu-note {
        display: none;

      .quake-main-menu-label-single-player {
        --quake-main-menu-label-width: 218;

      }

      .quake-main-menu-label-multiplayer {

      .quake-main-menu-label-quit {

        display: none;

                <img src="/q/menu-title-options.png" width="144" height="24" alt="Options" />
              </h1>
            </header>
            <div id="quake-options-sections" class="quake-menu-panel-sections">
              <div class="quake-options-list">
                <h2 class="quake-options-group-title quake-bm-label quake-bm-alt">Debug</h2>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-debug-show-outlines" type="checkbox" />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Show outlines</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-debug-enabled" type="checkbox" />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Show stats panel</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-debug-show-fps" type="checkbox" checked />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Show FPS panel</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <h2 class="quake-options-group-title quake-bm-label quake-bm-alt">Gameplay</h2>
                <button id="quake-option-crosshair" class="quake-option-toggle quake-option-cycle" type="button" aria-label="Crosshair +">
                  <span class="quake-option-text quake-bm-label">Crosshair</span>
                  <span id="quake-option-crosshair-value" class="quake-option-value quake-bm-label quake-bm-alt">+</span>
                </button>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-option-dynamic-lighting" type="checkbox" checked />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Dynamic lighting</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-option-disable-sound" type="checkbox" checked />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Mute sounds</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-option-impact-particles" type="checkbox" checked />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Show particles</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-option-disable-enemies" type="checkbox" />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Show enemies</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-option-disable-damage" type="checkbox" />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Disable damage</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-debug-freeze-enemies" type="checkbox" />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Disable movement</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-debug-disable-attacks" type="checkbox" />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Disable attacks</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
                <label class="quake-option-toggle" tabindex="0">
                  <input id="quake-option-invert-mouse" type="checkbox" />
                  <span class="quake-option-checkbox" aria-hidden="true"></span>
                  <span class="quake-option-text quake-bm-label">Invert mouse</span>
                  <span class="quake-option-value quake-option-value-off quake-bm-label quake-bm-alt">off</span>
                  <span class="quake-option-value quake-option-value-on quake-bm-label quake-bm-alt">on</span>
                </label>
              </div>
            </div>
            <nav id="quake-options-actions" class="quake-menu-actions" aria-label="Options actions">
              <button id="quake-options-back" class="quake-bm-label quake-bm-alt" type="button">Back</button>
            </nav>
          </div>
        </section>
        <!-- crosshair -->
        <div id="quake-crosshair" aria-hidden="true"></div>
        <!-- status bar -->
        <div id="quake-classic-hud" aria-label="Quake status bar">
          <img id="quake-classic-hud-image" src="/q/hud.png" width="320" height="24" alt="" />
          <div id="quake-hud-inventory" aria-hidden="true"></div>
          <div id="quake-hud-status-row" aria-hidden="true"></div>
          <div id="quake-hud-frame" aria-hidden="true">
            <span class="quake-hud-slot" data-qslot="armor-green" hidden></span>
            <span class="quake-hud-slot" data-qslot="armor-yellow" hidden></span>
            <span class="quake-hud-slot" data-qslot="armor-red" hidden></span>
            <span class="quake-hud-slot" data-qslot="face-normal" hidden></span>
            <span class="quake-hud-slot" data-qslot="face-invisibility" hidden></span>
            <span class="quake-hud-slot" data-qslot="face-invulnerability" hidden></span>
            <span class="quake-hud-slot" data-qslot="face-invisibility-invulnerability" hidden></span>
            <span class="quake-hud-slot" data-qslot="face-quad" hidden></span>
            <span class="quake-hud-slot" data-qslot="ammo-shells" hidden></span>
            <span class="quake-hud-slot" data-qslot="ammo-nails" hidden></span>
            <span class="quake-hud-slot" data-qslot="ammo-rockets" hidden></span>
            <span class="quake-hud-slot" data-qslot="ammo-cells" hidden></span>
            <span class="quake-hud-slot" data-qslot="key-silver" hidden></span>
            <span class="quake-hud-slot" data-qslot="key-gold" hidden></span>
            <span class="quake-hud-slot" data-qslot="powerup-invisibility" hidden></span>
            <span class="quake-hud-slot" data-qslot="powerup-invulnerability" hidden></span>
            <span class="quake-hud-slot" data-qslot="powerup-biosuit" hidden></span>
            <span class="quake-hud-slot" data-qslot="powerup-quad" hidden></span>
          </div>
          <div id="quake-hud-values" aria-hidden="true">
            <span id="quake-hud-armor-value" class="quake-hud-readout quake-hud-readout-armor">
              <span class="quake-hud-digit"></span>
              <span class="quake-hud-digit"></span>
              <span class="quake-hud-digit"></span>
            </span>
            <span id="quake-hud-health-value" class="quake-hud-readout quake-hud-readout-health">
              <span class="quake-hud-digit"></span>
              <span class="quake-hud-digit"></span>
              <span class="quake-hud-digit"></span>
            </span>
            <span
              id="quake-hud-health-damage-value"
              class="quake-hud-readout quake-hud-readout-health quake-hud-readout-health-damage"
            >
              <span class="quake-hud-digit"></span>
              <span class="quake-hud-digit"></span>
              <span class="quake-hud-digit"></span>
            </span>
            <span id="quake-hud-ammo-value" class="quake-hud-readout quake-hud-readout-ammo">
              <span class="quake-hud-digit"></span>
              <span class="quake-hud-digit"></span>
              <span class="quake-hud-digit"></span>
            </span>
          </div>
        </div>
      </div>
      <a
        class="btn-github"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="View source on GitHub"
        href="https://github.com/LayoutitStudio/cssQuake"
      >
        <svg

          />

      </a>
      <a
        class="quake-id-software-link"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="View Quake source on GitHub"
        href="https://github.com/id-Software/Quake"
      >
        <img
          class="quake-id-software-logo"
          src="/src/assets/id-software-logo.svg"
          width="40"
          height="40"
          alt=""
        />
      </a>
      <a
        class="quake-css-logo"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="Visit Layoutit"
        href="https://layoutit.com/"
      >
        <img
          class="quake-css-logo-mark"
          src="/src/assets/css-logo.svg"
          width="40"
          height="40"
          alt=""
        />
      </a>
      <!-- loading -->
      <div id="quake-loading-overlay" role="status" aria-live="polite" aria-busy="true">
        <div class="quake-loading-mark">
          <div class="quake-loading-readout">
            <span id="quake-loading-status" class="quake-loading-console-lines"></span>
            <div id="quake-loading-progress" class="quake-loading-progress-indeterminate" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100">
              <span id="quake-loading-progress-fill"></span>
            </div>
            <span id="quake-loading-action" class="quake-bm-label quake-bm-alt" hidden></span>
          </div>
        </div>
      </div>
      <!-- debug panel -->
      <div id="quake-debug-stack">
        <aside id="quake-debug-panel" aria-labelledby="quake-debug-title" hidden>
          <div id="quake-debug-card">
            <header id="quake-debug-header">
              <h2 id="quake-debug-title" class="quake-bm-label quake-bm-alt">Debug</h2>
            </header>
            <dl id="quake-debug-stats" aria-label="Debug stats">
              <div id="quake-debug-recording-row" hidden>
                <dt class="quake-bm-label">Record</dt>
                <dd class="quake-debug-recording-control">
                  <button id="quake-debug-recording-toggle" class="quake-debug-recording-button" type="button" aria-pressed="false">RECORD</button>
                  <span data-qstat="recording">-</span>
                </dd>
              </div>
              <div><dt class="quake-bm-label">Capture</dt><dd data-qstat="capture">-</dd></div>
              <div><dt class="quake-bm-label">Visible</dt><dd data-qstat="visible">-</dd></div>
              <div><dt class="quake-bm-label">DOM</dt><dd data-qstat="dom">-</dd></div>
              <div><dt class="quake-bm-label">Enemies</dt><dd data-qstat="enemies">-</dd></div>
              <div><dt class="quake-bm-label">Pickups</dt><dd data-qstat="pickups">-</dd></div>
            </dl>
            <div id="quake-debug-outline-legend" aria-label="Surface outline legend">
              <span><span class="quake-debug-outline-swatch quake-debug-outline-swatch-world" aria-hidden="true"></span><span class="quake-bm-label">World</span></span>
              <span><span class="quake-debug-outline-swatch quake-debug-outline-swatch-special" aria-hidden="true"></span><span class="quake-bm-label">Special</span></span>
              <span><span class="quake-debug-outline-swatch quake-debug-outline-swatch-movers" aria-hidden="true"></span><span class="quake-bm-label">Objects/items</span></span>
              <span><span class="quake-debug-outline-swatch quake-debug-outline-swatch-enemies" aria-hidden="true"></span><span class="quake-bm-label">Enemies</span></span>
            </div>
          </div>
        </aside>
      </div>
      </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
