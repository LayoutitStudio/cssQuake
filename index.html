      #quake-loading-status {
        display: flex;

        justify-content: flex-start;
        width: min(720px, calc(100vw - 24px));
        color: #e8d8ad;

        letter-spacing: 0;
        text-shadow: 2px 2px 0 #000000;
      }

      #quake-loading-status::before {
        display: none;
        content: none;
      }

      #quake-loading-status .quake-bitmap-text {
        --quake-bitmap-glyph-size: 16px;
        --quake-bitmap-sheet-size: 256px;
        --quake-bitmap-space-size: 16px;
        justify-content: flex-start;
        gap: 0 var(--quake-bitmap-space-size);
      }

      .quake-loading-console-line {
        display: block;
        min-height: 16px;
        margin: 0 0 2px;
        overflow-wrap: anywhere;
      }

      .quake-bitmap-source {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .quake-bitmap-host {
        font-size: 0;
        line-height: 0;
      }

      .quake-bitmap-text {
        --quake-bitmap-glyph-size: 16px;
        --quake-bitmap-sheet-size: 256px;
        --quake-bitmap-space-size: 11px;
        display: flex;
        flex-wrap: wrap;
        gap: 5px var(--quake-bitmap-space-size);
        max-width: 100%;
        image-rendering: pixelated;
        pointer-events: none;
        vertical-align: top;
      }

      .quake-bitmap-text--title {
        --quake-bitmap-glyph-size: 40px;
        --quake-bitmap-sheet-size: 640px;
        --quake-bitmap-space-size: 28px;
      }

      .quake-bitmap-word {
        display: inline-flex;
        flex: 0 0 auto;
        height: var(--quake-bitmap-glyph-size);
      }

      .quake-bitmap-glyph {
        display: block;
        flex: 0 0 auto;
        width: var(--quake-bitmap-glyph-size);
        height: var(--quake-bitmap-glyph-size);
        background-image: url("/q/conchars.png");
        background-size: var(--quake-bitmap-sheet-size) var(--quake-bitmap-sheet-size);
        image-rendering: pixelated;
      }

      .quake-bitmap-col-1 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -1); }
      .quake-bitmap-col-4 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -4); }
      .quake-bitmap-col-7 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -7); }
      .quake-bitmap-col-9 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -9); }
      .quake-bitmap-col-12 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -12); }
      .quake-bitmap-col-14 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -14); }
      .quake-bitmap-col-15 { background-position-x: calc(var(--quake-bitmap-glyph-size) * -15); }
      .quake-bitmap-row-12 { background-position-y: calc(var(--quake-bitmap-glyph-size) * -12); }
      .quake-bitmap-row-14 { background-position-y: calc(var(--quake-bitmap-glyph-size) * -14); }

      #quake-loading-progress {
        --quake-loading-progress: 0;
        display: none;
        position: relative;
        width: min(250px, 72vw);
        height: 14px;
        padding: 2px;
        overflow: hidden;
        border: 2px solid #523821;
        background: #120b07;
        box-shadow:
          4px 4px 0 #000000,
          0 2px 0 #000000,
          inset 0 1px 0 rgba(240, 173, 92, 0.25),
          inset 0 -1px 0 rgba(0, 0, 0, 0.75);
      }

      #quake-loading-progress-fill {
        display: block;
        width: 100%;
        height: 100%;
        transform: scaleX(var(--quake-loading-progress));
        transform-origin: left center;
        background: #7f4a2f;
        image-rendering: pixelated;
        transition: transform 120ms steps(8, end);
      }

      #quake-loading-progress.quake-loading-progress-indeterminate #quake-loading-progress-fill {
        width: 36%;
        transform: translateX(-100%);
        animation: quake-loading-progress-indeterminate 900ms steps(12, end) infinite;
      }

      @keyframes quake-loading-progress-indeterminate {
        to {
          transform: translateX(280%);

    <script>
      (() => {
        const lineLimit = 10;
        const lineMaxChars = 42;

        function errorText(error) {
          if (error instanceof Error) return error.stack || `${error.name}: ${error.message}`;
          if (typeof error === "string") return error;
          try {
            const json = JSON.stringify(error);
            if (json) return json;
          } catch {
            // Fall through to String().
          }
          return String(error);
        }

        function wrapLine(line) {
          if (line.length <= lineMaxChars) return [line];
          const words = line.split(/\s+/).filter(Boolean);
          const wrapped = [];
          let current = "";
          for (const word of words) {
            if (word.length > lineMaxChars) {
              if (current) {
                wrapped.push(current);
                current = "";
              }
              for (let index = 0; index < word.length; index += lineMaxChars) {
                wrapped.push(word.slice(index, index + lineMaxChars));
              }
              continue;
            }
            const next = current ? `${current} ${word}` : word;
            if (next.length <= lineMaxChars) {
              current = next;
            } else {
              wrapped.push(current);
              current = word;
            }
          }
          if (current) wrapped.push(current);
          return wrapped.length ? wrapped : [line.slice(0, lineMaxChars)];
        }

        function errorLines(error) {
          const rawLines = errorText(error)
            .split(/\r?\n/)
            .map((line) => line.replace(/\s+/g, " ").trim())
            .filter(Boolean);
          const lines = ["Load failed"];
          for (let index = 0; index < rawLines.length && lines.length < lineLimit; index++) {
            const prefix = index === 0 ? "error: " : "";
            for (const line of wrapLine(`${prefix}${rawLines[index]}`)) {
              lines.push(line);
              if (lines.length >= lineLimit) break;
            }
          }
          return lines;
        }

        function glyph(char) {
          const code = char.charCodeAt(0) & 127;
          const element = document.createElement("span");
          element.className = `quake-bitmap-glyph quake-bitmap-col-${code & 15} quake-bitmap-row-${code >> 4}`;
          return element;
        }

        function bitmapWord(text) {
          const word = document.createElement("span");
          word.className = "quake-bitmap-word";
          for (const char of text) word.append(glyph(char));
          return word;
        }

        function bitmapText(text) {
          const source = document.createElement("span");
          source.className = "quake-bitmap-source";
          source.textContent = text;

          const bitmap = document.createElement("span");
          bitmap.className = "quake-bitmap-text quake-bitmap-text--copy quake-bitmap-text--word";
          bitmap.setAttribute("aria-hidden", "true");
          for (const word of text.split(" ")) {
            if (word) bitmap.append(bitmapWord(word));
          }
          return [source, bitmap];
        }

        function hideMainMenuForError() {
          document.body.classList.remove("quake-menu-open", "quake-main-menu-pending");
          document.body.classList.add("quake-main-menu-deferred");
          const mainMenu = document.getElementById("quake-main-menu");
          if (mainMenu) mainMenu.hidden = true;
          document.querySelectorAll(".quake-menu-panel").forEach((panel) => {
            panel.setAttribute("hidden", "");
          });
        }

        window.__cssQuakeShowLoadingError = (error) => {
          hideMainMenuForError();
          const overlay = document.getElementById("quake-loading-overlay");
          const status = document.getElementById("quake-loading-status");
          const progress = document.getElementById("quake-loading-progress");
          const action = document.getElementById("quake-loading-action");
          if (!overlay || !status) return;
          document.body.classList.add("quake-loading");
          overlay.hidden = false;
          overlay.setAttribute("aria-busy", "false");
          overlay.classList.add("quake-loading-console-persisted");
          status.textContent = "";
          const lines = errorLines(error);
          for (const line of lines) {
            const element = document.createElement("span");
            element.className = "quake-loading-console-line quake-bm-copy quake-bitmap-host";
            element.append(...bitmapText(line));
            status.append(element);
          }
          status.setAttribute("aria-label", lines.join("\n"));
          if (progress) progress.hidden = true;
          if (action) action.hidden = true;
        };

        window.addEventListener("error", (event) => {
          window.__cssQuakeShowLoadingError(event.error || event.message);
        });
        window.addEventListener("unhandledrejection", (event) => {
          window.__cssQuakeShowLoadingError(event.reason);
        });
      })();
    </script>
